# Python environment for options-analytics-kdb
# Create:   conda env create -f environment.yml
# Activate: conda activate oak
# Update:   conda env update -f environment.yml --prune
name: oak
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # numerics
  - numpy
  - pandas
  - scipy
  # C++ <-> Python bridge
  - pybind11
  # data feed (Deribit REST + websocket)
  - requests
  - websockets
  # dashboard (versions as tested; the public demo pins the same in deploy/hf-space)
  - dash=2.18.2
  - plotly
  - pyarrow
  # testing
  - pytest
  - pip
  - pip:
      - pykx   # Python <-> kdb+/q
      - huggingface_hub   # only for uploading the public demo (scripts/deploy_demo.py)
