[pytest]
testpaths = tests
pythonpath = .
addopts = -q
filterwarnings =
    # PyKX bug: when the server hangs up, PyKX's own socket reader calls its async close()
    # without awaiting it (pykx/ipc.py). Happens when the fake tickerplant stops after a test.
    ignore:coroutine 'RawQConnection.close' was never awaited:RuntimeWarning
