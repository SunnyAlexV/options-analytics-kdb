# Streamlit theme for the public demo (streamlit_app/app.py): the dashboard's dark desk palette
# (dashboard/theme.py). Community Cloud reads this file only from the repository root.
[theme]
base = "dark"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
primaryColor = "#3987e5"
font = "sans serif"

[browser]
gatherUsageStats = false
